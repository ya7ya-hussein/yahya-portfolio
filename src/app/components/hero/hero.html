<section id="home" class="hero">
    <div class="hero-content">
        <p class="hero-location">
            <i class="fas fa-location-dot" aria-hidden="true"></i>
            <span>{{ personalInfo.location }}</span>
        </p>

        <h1 class="hero-title">{{ personalInfo.name }}</h1>
        <p class="hero-subtitle">{{ personalInfo.title }}</p>
        <p class="hero-description">{{ personalInfo.description }}</p>

        <a href="#projects" class="cta-button">
            <i class="fas fa-rocket" aria-hidden="true"></i>
            <span>View My Work</span>
        </a>

        <ul class="social-links">
            <li>
                <a class="social-link" [href]="personalInfo.linkedin"
                   target="_blank" rel="noopener noreferrer"
                   aria-label="LinkedIn profile">
                    <i class="fab fa-linkedin" aria-hidden="true"></i>
                </a>
            </li>
            <li>
                <a class="social-link" [href]="personalInfo.github"
                   target="_blank" rel="noopener noreferrer"
                   aria-label="GitHub profile">
                    <i class="fab fa-github" aria-hidden="true"></i>
                </a>
            </li>
            <li>
                <a class="social-link" [href]="'mailto:' + personalInfo.email"
                   [attr.aria-label]="'Email ' + personalInfo.email">
                    <i class="fas fa-envelope" aria-hidden="true"></i>
                </a>
            </li>
            <!-- <li>
                <a class="social-link" href="/cv.pdf"
                   target="_blank" rel="noopener noreferrer"
                   aria-label="Download CV (PDF)">
                    <span class="cv-label" aria-hidden="true">CV</span>
                </a>
            </li> -->
        </ul>
    </div>

    <a href="#about" class="scroll-indicator" aria-label="Scroll to About">
        <i class="fas fa-chevron-down" aria-hidden="true"></i>
    </a>
</section>
