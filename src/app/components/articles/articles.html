<section id="articles" class="section fade-in">
    <h2 class="section-title">Articles</h2>
    <p class="section-subtitle">
        Writing about robot learning, simulation tooling, and the state of embodied AI.
    </p>

    <!-- Filter row -->
    <div class="articles-filter">
        <button
            *ngFor="let filter of filters"
            class="filter-btn"
            [class.active]="activeFilter === filter"
            (click)="setFilter(filter)">
            {{ filter }}
        </button>
    </div>

    <!-- Article list -->
    <div class="articles-list">
        <ng-container *ngFor="let article of filteredArticles">

            <!-- Published article with live link -->
            <a *ngIf="article.published && article.url && !article.upcoming"
               [href]="article.url"
               target="_blank"
               rel="noopener noreferrer"
               class="article-row">
                <div class="article-thumb" [ngClass]="'article-thumb--' + article.platform.toLowerCase()">
                    <i [class]="article.platformIcon"></i>
                </div>
                <span class="article-title">{{ article.title }}</span>
                <span class="article-platform-label">{{ article.platform }}</span>
                <span class="article-date">{{ article.date }}</span>
                <i class="fas fa-arrow-up-right-from-square article-arrow"></i>
            </a>

            <!-- Upcoming / unpublished article -->
            <div *ngIf="!article.published || !article.url || article.upcoming"
                 class="article-row article-row--disabled">
                <div class="article-thumb" [ngClass]="'article-thumb--' + article.platform.toLowerCase()">
                    <i [class]="article.platformIcon"></i>
                </div>
                <span class="article-title">{{ article.title }}</span>
                <span class="badge badge--upcoming">Upcoming</span>
                <span class="article-date">{{ article.date }}</span>
            </div>

        </ng-container>
    </div>
</section>
